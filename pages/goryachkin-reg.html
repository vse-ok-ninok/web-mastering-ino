<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Document</title>
    <link href="goryachkin-reg.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inconsolata:wght@200..900&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Mozilla+Text:wght@200..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap&quot; rel="stylesheet">
</head>
<body>
    <form action="#" method="post">
        <h1>Create an account</h1>
        
        <div class="reg_part1">
            <label>Имя:</label>
            <input type="text" name="user-name" placeholder="Введите имя">
        
            
            <label>Номер телефона:</label>
            <input type="number" name="number-user">
            

            <label>Пароль:</label>
            <input type="password" name="password-user" minlength="8" required>

            <label>Дата рождения:</label>
            <input type="date" name="birthday-user">
        </div>
        
        <div class="reg_part2">
            <label>Мужской</label>
            <input type="radio" name="gender-user">
        </div>

        <div class="reg_part2">
            <label>Женский</label>
            <input type="radio" name="gender-user">
        </div>

        <div class="reg_part2">
            <label>Согласие на обработку данных</label>
            <input type="checkbox" name="soglasie" required>
        </div>

        <div class="reg_part2">
            <label>Согласие на рассылку</label>
            <input type="checkbox" name="reklama"> 
        </div>

        <button  type="submit">Зарегистрироваться</button>
        <button  type="reset">Сброс</button>
    </form>
</body>
</html>
